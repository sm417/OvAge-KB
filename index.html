<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OvAge-KB: Ovarian Aging Target Knowledge Base</title>
    <script src="vendor/react.min.js"></script>
    <script src="vendor/react-dom.min.js"></script>
    <script src="vendor/chart.min.js"></script>
    <script src="vendor/cytoscape.min.js"></script>
    <style>
        :root{--bg:#f8f7f4;--surface:#fff;--surface-alt:#f2f0ec;--border:#e5e2db;--border-strong:#d1cdc4;--text-primary:#1a1816;--text-secondary:#5c5650;--text-muted:#908a82;--accent:#b44d2d;--accent-light:#e8d5cc;--accent-dark:#8a3a22;--blue:#2d6fb4;--blue-light:#d0e2f4;--green:#2d8a4e;--green-light:#d0f0dc;--red:#c0392b;--red-light:#f5d5d1;--purple:#6b4fa0;--purple-light:#e4dcf0;--gold:#b8860b;--gold-light:#faf0d0;--teal:#1a8a7a;--teal-light:#d0f0ec;--font-body:'DM Sans',-apple-system,sans-serif;--font-display:'DM Serif Display',Georgia,serif;--font-mono:'JetBrains Mono',monospace;--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(26,24,22,.06),0 1px 2px rgba(26,24,22,.04);--shadow-lg:0 4px 12px rgba(26,24,22,.08),0 2px 4px rgba(26,24,22,.04)}
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font-body);background:var(--bg);color:var(--text-primary);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}.app-container{min-height:100vh;max-width:1600px;margin:0 auto}
        .header{background:var(--text-primary);color:#fff;padding:2.5rem 3rem;position:relative;overflow:hidden}.header::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(180,77,45,.15) 0%,transparent 70%)}.header-inner{position:relative;z-index:1}.header-label{display:inline-block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;background:rgba(180,77,45,.3);color:#e8d5cc;padding:.3rem .8rem;border-radius:4px;margin-bottom:1rem}.header h1{font-family:var(--font-display);font-size:2.2rem;font-weight:400;margin-bottom:.5rem}.header p{color:rgba(255,255,255,.6);font-size:.95rem;max-width:600px}
        .nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;position:sticky;top:0;z-index:100;scrollbar-width:thin}.nav::-webkit-scrollbar{height:2px}.nav::-webkit-scrollbar-thumb{background:var(--border-strong)}.nav-item{padding:.85rem 1.25rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-size:.82rem;font-weight:500;color:var(--text-muted);letter-spacing:.01em}.nav-item:hover{color:var(--text-primary);background:var(--surface-alt)}.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}
        .content{padding:2rem;max-width:1400px;margin:0 auto}.card{background:var(--surface);border-radius:var(--radius-lg);padding:2rem;margin-bottom:1.5rem;box-shadow:var(--shadow);border:1px solid var(--border)}.card h3{font-family:var(--font-display);font-size:1.35rem;font-weight:400;margin-bottom:.5rem}.card-sub{color:var(--text-muted);font-size:.85rem;margin-bottom:1.5rem;line-height:1.5}
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}.stat-box{padding:1.25rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-alt);text-align:center;transition:transform .15s}.stat-box:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.stat-box.accent{background:var(--accent-light);border-color:rgba(180,77,45,.2)}.stat-box.blue{background:var(--blue-light);border-color:rgba(45,111,180,.2)}.stat-box.green{background:var(--green-light);border-color:rgba(45,138,78,.2)}.stat-box.purple{background:var(--purple-light);border-color:rgba(107,79,160,.2)}.stat-box.gold{background:var(--gold-light);border-color:rgba(184,134,11,.2)}.stat-box.red{background:var(--red-light);border-color:rgba(192,57,43,.2)}.stat-num{font-family:var(--font-display);font-size:2rem;font-weight:400;line-height:1.2}.stat-label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:.25rem}
        .data-table{width:100%;border-collapse:collapse;font-size:.8rem}.data-table th{background:var(--surface-alt);padding:.65rem .75rem;text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);border-bottom:2px solid var(--border-strong);position:sticky;top:0;z-index:10}.data-table td{padding:.6rem .75rem;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:top}.data-table tr:hover td{background:rgba(180,77,45,.03)}.gene-link{color:var(--accent);cursor:pointer;font-weight:600;border-bottom:1px dashed rgba(180,77,45,.3)}.gene-link:hover{border-bottom-color:var(--accent)}
        .search-box{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font-body);font-size:.85rem;background:var(--surface);color:var(--text-primary);transition:border-color .15s}.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,77,45,.08)}.search-box::placeholder{color:var(--text-muted)}
        .filter-tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}.filter-tab{padding:.4rem .85rem;border-radius:100px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.78rem;font-weight:500;transition:all .15s;color:var(--text-secondary)}.filter-tab:hover{border-color:var(--accent);color:var(--accent)}.filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
        .badge{display:inline-block;padding:.15rem .55rem;border-radius:100px;font-size:.68rem;font-weight:600;letter-spacing:.02em}.badge-a{background:var(--green-light);color:var(--green)}.badge-b{background:var(--blue-light);color:var(--blue)}.badge-approved{background:var(--green-light);color:var(--green)}.badge-experimental{background:var(--gold-light);color:var(--gold)}.badge-up{background:var(--red-light);color:var(--red)}.badge-down{background:var(--blue-light);color:var(--blue)}.badge-sig{background:var(--accent-light);color:var(--accent-dark)}
        .pagination{display:flex;justify-content:center;align-items:center;gap:.75rem;margin-top:1.5rem}.pagination button{padding:.4rem .9rem;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.8rem;font-weight:500;transition:all .15s}.pagination button:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent)}.pagination button:disabled{opacity:.4;cursor:not-allowed}.pagination span{font-size:.8rem;color:var(--text-muted)}
        .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.alert{padding:1rem 1.25rem;border-radius:var(--radius);font-size:.85rem}.alert-info{background:var(--blue-light);border:1px solid rgba(45,111,180,.2);color:var(--blue)}
        .cy-container{width:100%;height:550px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-alt)}.gene-chip{display:inline-block;padding:.2rem .6rem;margin:.15rem;background:var(--surface-alt);border:1px solid var(--border);border-radius:100px;font-size:.75rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all .15s}.gene-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}.module-card{background:var(--surface);border-radius:var(--radius-lg);padding:1.5rem;cursor:pointer;transition:all .2s;border:1px solid var(--border)}.module-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}.module-card .module-icon{font-size:2rem;margin-bottom:.75rem}.module-card h4{font-size:.95rem;font-weight:600;margin-bottom:.35rem}.module-card p{color:var(--text-muted);font-size:.78rem;line-height:1.4}.module-card.no-data{opacity:.5}
        .manhattan-image{width:100%;max-width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius);margin:1rem 0;display:block}
        .modal-overlay{position:fixed;inset:0;background:rgba(26,24,22,.5);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}.modal-content{background:var(--surface);border-radius:var(--radius-lg);padding:2rem;max-width:900px;width:90%;max-height:85vh;overflow:auto;box-shadow:0 20px 40px rgba(26,24,22,.2)}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);padding:.25rem}.modal-close:hover{color:var(--text-primary)}.modal-section-title{font-weight:600;font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;margin-top:1rem}
        .hm-cell{display:inline-block;width:28px;height:28px;border-radius:4px;line-height:28px;text-align:center;font-size:.75rem;font-weight:600}.hm-yes{background:var(--green-light);color:var(--green)}.hm-no{background:var(--surface-alt);color:var(--border-strong)}
        .footer{padding:2rem;text-align:center;border-top:1px solid var(--border);color:var(--text-muted);font-size:.78rem}
        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}@media(max-width:900px){.two-col{grid-template-columns:1fr}}@media(max-width:768px){.header{padding:1.5rem}.header h1{font-size:1.5rem}.content{padding:1rem}.module-grid{grid-template-columns:1fr}.card{padding:1.25rem}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="data/data_bundle.js"></script>
    <script src="app.js"></script>
</body>
</html>
